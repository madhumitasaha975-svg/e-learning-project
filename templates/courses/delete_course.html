{% extends "base.html" %}
{% block title %}Delete Course{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="dashboard-card p-5 text-center">

      <div style="font-size: 3.5rem; margin-bottom: 16px;">⚠️</div>

      <h4 class="fw-bold mb-2">Delete "{{ course.title }}"?</h4>
      <p class="text-muted mb-4">
        This will permanently delete the course and all its lessons.
        This action <strong>cannot be undone</strong>.
      </p>

      <div class="d-flex gap-3 justify-content-center">
        <form method="POST">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </form>
        <a href="{% url 'manage_course' course.pk %}" class="btn btn-outline-secondary">
          Cancel
        </a>
      </div>

    </div>
  </div>
</div>

{% endblock %}
