{% extends "base.html" %}
{% block title %}Password Changed{% endblock %}

{% block content %}

<div class="dashboard-container">
  <div class="row justify-content-center">
    <div class="col-lg-6">

      <div class="dashboard-card p-5 text-center">

        <div style="font-size: 4rem; margin-bottom: 16px;">🎉</div>

        <h4 class="fw-bold mb-2">Password Changed!</h4>
        <p class="text-muted mb-4">
          Your password has been updated successfully. You can now use your new password to log in.
        </p>

        <div class="d-flex gap-3 justify-content-center">
          <a href="{% url 'student_dashboard' %}" class="btn btn-primary">
            Go to Dashboard
          </a>
          <a href="{% url 'profile' %}" class="btn btn-outline-secondary">
            Back to Profile
          </a>
        </div>

      </div>

    </div>
  </div>
</div>

{% endblock %}
